      .layerTitle{font-size:17px;font-weight:800}
      .cardTitle{font-size:15px;font-weight:800}
      .cardText{font-size:12px;font-weight:500;fill:#465466}
      .small{font-size:12px;font-weight:700}
      .tiny{font-size:11px;font-weight:600;fill:#596779}
      .flow{fill:none;stroke:#243447;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .flowBlue{fill:none;stroke:#2d74da;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .flowPurple{fill:none;stroke:#7d58d8;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 7;marker-end:url(#arrowPurple)}
      .dash{fill:none;stroke:#7d58d8;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:6 7}
