<svg xmlns="http://www.w3.org/2000/svg" width="2060" height="1240" viewBox="0 0 2060 1240" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Platform Runtime Workflow</title>
  <desc id="desc">Layered workflow diagram for the Interactive 3D Chatbot project, showing client channels, gateway, orchestration, agents, retrieval, speech, reliability, observability, storage, and ordered runtime flow.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#243447"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2d74da"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#7d58d8"/>
    </marker>
    <style>
